spring.application.name=smarttask

line.channel-secret=${LINE_CHANNEL_SECRET}
line.channel-access-token=${LINE_CHANNEL_ACCESS_TOKEN}

# TiDB Cloud Database
spring.datasource.url=jdbc:mysql://${TIDB_HOST}:${TIDB_PORT}/${TIDB_DATABASE}?sslMode=VERIFY_IDENTITY&tlsVersions=TLSv1.2&trustCertificateKeyStoreUrl=file:certs/tidb-truststore.p12&trustCertificateKeyStoreType=PKCS12

spring.datasource.username=${TIDB_USERNAME}
spring.datasource.password=${TIDB_PASSWORD}

spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${TIDB_TRUSTSTORE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
