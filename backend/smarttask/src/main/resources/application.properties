spring.application.name=smarttask

line.channel-secret=${LINE_CHANNEL_SECRET}
line.channel-access-token=${LINE_CHANNEL_ACCESS_TOKEN}

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3307/smarttask
spring.datasource.username=smarttask_user
spring.datasource.password=${MYSQL_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
